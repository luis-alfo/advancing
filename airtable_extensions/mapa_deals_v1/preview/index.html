<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview — Mapa de deals activos</title>
    <!-- Tipografía de marca -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind Play CDN con los MISMOS tokens de marca que tailwind.config.js (ver design.md) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Mulish', 'ui-sans-serif', 'system-ui', 'sans-serif', 'Apple Color Emoji', 'Segoe UI Emoji'],
              display: ['Mulish', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            colors: {
              brand: { 50: '#f2f4ff', 100: '#e6ebff', 200: '#c7d3ff', 300: '#d3ddff', 400: '#6f80e8', 500: '#0916ae', 600: '#0713a0', 700: '#050f8d', 900: '#02005c', DEFAULT: '#050f8d' },
              mint: { 100: '#e4fcf2', 200: '#a3ffd9', 400: '#43feae', 500: '#24df86', 700: '#0f8a4f', DEFAULT: '#43feae' },
              amber: { 100: '#fdf3d7', 500: '#d99a14', 700: '#8a5a00' },
              ink: '#181d26', navy: '#162040',
              slate: { 200: '#e5e7eb', 300: '#cbd0d8', 400: '#9ca3af', 500: '#6b7280', 600: '#4b5563' },
              line: '#e8e9ee', canvas: '#f7f8fc', paper: '#ffffff',
            },
            borderRadius: { md: '0.375rem', lg: '0.5rem', xl: '0.75rem' },
            boxShadow: { card: '0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.06)', soft: '0 1px 2px rgba(2,0,92,.03), 0 12px 32px -14px rgba(2,0,92,.16)' },
          },
        },
      };
    </script>
    <style>
      html, body, #root { height: 100%; }
      body { font-family: 'Mulish', ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Cache-busting: el http.server no manda no-cache; forzamos bundle fresco en cada recarga. -->
    <script>
      const s = document.createElement('script');
      s.src = './preview.bundle.js?t=' + Date.now();
      document.body.appendChild(s);
    </script>
  </body>
</html>
